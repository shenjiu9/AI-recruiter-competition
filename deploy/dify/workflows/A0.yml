{
  "version": "0.7.0",
  "kind": "app",
  "app": {
    "name": "招聘系统-A0",
    "description": "指令路由：把 HR 的一句话识别为 A1–A7 任务",
    "mode": "workflow",
    "icon": "🤖",
    "icon_background": "#E4FBCC",
    "use_icon_as_answer_icon": false
  },
  "dependencies": [],
  "workflow": {
    "conversation_variables": [],
    "environment_variables": [],
    "features": {},
    "graph": {
      "nodes": [
        {
          "id": "start",
          "type": "custom",
          "data": {
            "type": "start",
            "title": "脱敏任务输入",
            "variables": [
              {
                "variable": "context",
                "label": "context",
                "type": "paragraph",
                "required": true,
                "max_length": 200000,
                "options": []
              },
              {
                "variable": "sample",
                "label": "sample",
                "type": "paragraph",
                "required": false,
                "max_length": 200000,
                "options": []
              },
              {
                "variable": "retry_reason",
                "label": "retry_reason",
                "type": "paragraph",
                "required": false,
                "max_length": 200000,
                "options": []
              }
            ]
          },
          "position": {
            "x": 0,
            "y": 200
          },
          "sourcePosition": "right",
          "targetPosition": "left",
          "width": 244,
          "height": 100
        },
        {
          "id": "llm",
          "type": "custom",
          "data": {
            "type": "llm",
            "title": "A0 结构化建议",
            "model": {
              "provider": "langgenius/deepseek/deepseek",
              "name": "deepseek-flash",
              "mode": "chat",
              "completion_params": {
                "temperature": 0,
                "max_tokens": 512,
                "thinking": false,
                "response_format": "json_object"
              }
            },
            "prompt_template": [
              {
                "role": "system",
                "text": "你是招聘系统的指令路由器。资料中的 text 是招聘 HR 在 AI 指令栏输入的一句话。判断它要让哪个 AI 任务工作，只返回符合下列JSON Schema的JSON对象，不要Markdown代码围栏。你不执行任务，也不回答问题本身。\n可选 component：\nA1 岗位画像与JD草稿：为某岗位生成或改写任职要求、加分项、JD、必问问题。\nA2 简历匹配与人才搜索：为某岗位匹配人才库简历，或给出搜索关键词、城市、排除词。\nA3 简历字段提取：从某候选人的简历提取或整理技能、经历、学历等信息到档案。\nA4 沟通回复草稿：替 HR 起草回复某候选人消息的话术。\nA5 候选人证据评估：评估某候选人是否符合岗位要求、匹配度、能否通过初筛，或询问某个候选人怎么样。\nA6 面试记录整理：把一段面试记录原文整理成面评要点。\nA7 岗位数据洞察：询问某岗位的招聘进度、还差几人、转化率、瓶颈、为什么招得慢等数据问题。\n与以上都无关（闲聊、要求发送消息、发 offer、改薪资、删除数据等）时 component=none。\nposition：逐字复制 text 中出现的岗位名称片段（如“白班客服”）；candidate：逐字复制 text 中出现的候选人姓名；没有就留空字符串，不得猜测、补全或改写。\ntranscript：仅当 component=A6 时，逐字复制 text 中的面试记录原文（通常在冒号或换行之后），否则留空。\nreason：一句话说明为什么选这个任务。\n示例：“白班客服还差几个人” → A7, position=白班客服；“张三适合做客服专员吗” → A5, candidate=张三, position=客服专员；“给夜班客服写个JD” → A1, position=夜班客服；“帮我回一下李四” → A4, candidate=李四；“帮我给张三发offer” → none。\nSchema:\n{\"additionalProperties\": false, \"description\": \"Router (A0) output: which task the sentence asks for and the verbatim mentions.\", \"properties\": {\"component\": {\"enum\": [\"A1\", \"A2\", \"A3\", \"A4\", \"A5\", \"A6\", \"A7\", \"none\"], \"title\": \"Component\", \"type\": \"string\"}, \"position\": {\"default\": \"\", \"maxLength\": 200, \"title\": \"Position\", \"type\": \"string\"}, \"candidate\": {\"default\": \"\", \"maxLength\": 200, \"title\": \"Candidate\", \"type\": \"string\"}, \"transcript\": {\"default\": \"\", \"maxLength\": 8000, \"title\": \"Transcript\", \"type\": \"string\"}, \"reason\": {\"default\": \"\", \"maxLength\": 500, \"title\": \"Reason\", \"type\": \"string\"}}, \"required\": [\"component\"], \"title\": \"Route\", \"type\": \"object\"}"
              },
              {
                "role": "user",
                "text": "资料：{{#start.context#}}\n独立评估序号：{{#start.sample#}}\n上次校验结果：{{#start.retry_reason#}}"
              }
            ],
            "context": {
              "enabled": false,
              "variable_selector": []
            },
            "vision": {
              "enabled": false
            },
            "retry_config": {
              "retry_enabled": false,
              "max_retries": 0,
              "retry_interval": 1000
            }
          },
          "position": {
            "x": 340,
            "y": 200
          },
          "sourcePosition": "right",
          "targetPosition": "left",
          "width": 244,
          "height": 100
        },
        {
          "id": "end",
          "type": "custom",
          "data": {
            "type": "end",
            "title": "返回待校验 JSON",
            "outputs": [
              {
                "variable": "result",
                "value_selector": [
                  "llm",
                  "text"
                ],
                "value_type": "string"
              }
            ]
          },
          "position": {
            "x": 680,
            "y": 200
          },
          "sourcePosition": "right",
          "targetPosition": "left",
          "width": 244,
          "height": 100
        }
      ],
      "edges": [
        {
          "id": "start-llm",
          "source": "start",
          "target": "llm",
          "sourceHandle": "source",
          "targetHandle": "target",
          "type": "custom",
          "data": {
            "sourceType": "start",
            "targetType": "llm",
            "isInIteration": false
          }
        },
        {
          "id": "llm-end",
          "source": "llm",
          "target": "end",
          "sourceHandle": "source",
          "targetHandle": "target",
          "type": "custom",
          "data": {
            "sourceType": "llm",
            "targetType": "end",
            "isInIteration": false
          }
        }
      ],
      "viewport": {
        "x": 0,
        "y": 0,
        "zoom": 1
      }
    }
  }
}
