{
  "version": "0.7.0",
  "kind": "app",
  "app": {
    "name": "招聘系统-A0",
    "description": "AI 招聘助手指令路由：识别 HR 一句话要做的事",
    "mode": "workflow",
    "icon": "🤖",
    "icon_background": "#E4FBCC",
    "use_icon_as_answer_icon": false
  },
  "dependencies": [],
  "workflow": {
    "conversation_variables": [],
    "environment_variables": [],
    "features": {},
    "graph": {
      "nodes": [
