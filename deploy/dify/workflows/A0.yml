          "id": "start",
          "type": "custom",
          "data": {
            "type": "start",
            "title": "脱敏任务输入",
            "variables": [
              {
                "variable": "context",
                "label": "context",
                "type": "paragraph",
                "required": true,
                "max_length": 200000,
                "options": []
              },
              {
                "variable": "sample",
                "label": "sample",
                "type": "paragraph",
                "required": false,
                "max_length": 200000,
                "options": []
              },
              {
                "variable": "retry_reason",
                "label": "retry_reason",
