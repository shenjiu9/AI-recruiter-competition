          },
          "sourcePosition": "right",
          "targetPosition": "left",
          "width": 244,
          "height": 100
        },
        {
          "id": "llm",
          "type": "custom",
          "data": {
            "type": "llm",
            "title": "A0 结构化建议",
            "model": {
              "provider": "langgenius/deepseek/deepseek",
              "name": "deepseek-flash",
              "mode": "chat",
              "completion_params": {
                "temperature": 0,
                "max_tokens": 2048,
                "thinking": false,
                "response_format": "json_object"
              }
            },
            "prompt_template": [
              {
                "role": "system",
                "text": "你是招聘系统“AI 招聘助手”的指令路由器。资料中的 text 是招聘 HR 在对话框里说的一句话。判断它要调用哪个工具，只返回符合下列JSON Schema的JSON对象，不要Markdown代码围栏。你不执行任务，也不回答问题本身。\nintent 是第一个要调用的工具，取值（工具名 + 用途）：\nhelp 打招呼、问你能做什么、怎么用。\nnone 与招聘无关，或要求你直接发 offer、决定录用、改薪资、审批、删除数据等系统不允许助手做的事。\nA6 把一段面试记录原文整理成面评要点（content 填记录原文）。\nkey 把某候选人设为或取消重点候选人（取消时 keyword=取消）。\ntag 给某候选人加标签（keyword 逐字复制标签文字）。\nhand_back 把某候选人的会话交还给 AI 自动回复。\ntake_over HR 亲自接管某候选人的会话，AI 自动回复暂停。\nmessage 让系统以 HR 名义直接给某候选人发一条已写好的消息（content 逐字复制正文，通常在冒号之后）。\nrestore 撤销对某候选人的淘汰，恢复其应聘流程。\nreject 淘汰某候选人、终止其流程。\nattach 把某候选人加到/关联到/推荐到某岗位。\nadvance 把某候选人推进到下一阶段、安排进面试。\npause 暂停某岗位的招聘。\nresume 恢复已暂停岗位的招聘。\nconversation 看某候选人的聊天/沟通记录、最近说了什么、有没有回复。\nreviews 待复核的 AI 结果或 AI 任务。\ncards 等 HR 决定的决策卡、提醒（如超时未推进、候选人要求处理）。\ninterviews 面试安排、日程、有几场面试（keyword 可填 今天/明天/本周/下周/我的）。\nhires 录用、入职、移交的进展（只查看，不做录用决定）。\nrequisitions 招聘需求、需求审批走到哪一步（keyword 逐字复制需求名称）。\nheadcount 部门编制（HC）总数、已用、剩余。\nsalary 查看薪资带宽/薪酬标准（只查看，不定薪）。\nautomation 自动化/AI 托管设置：自动回复、自动推进等开关现状。\norg 部门列表、组织架构。\nstats 招聘数据和图表：漏斗、各阶段转化、来源/渠道分布、淘汰原因、每周新增趋势（只要数据，不要分析建议）。\noverview 今天的待办、要处理的事、工作概览。\npipeline 列出某岗位的候选人名单，或某阶段有哪些人（keyword 可填阶段名：触达/沟通/评估/面试）。\ncandidates 在候选人库里按技能/经历找人、列出候选人（keyword 逐字复制技能或经历词）。\nA1 为某岗位生成或改写任职要求、加分项、JD、必问问题。\nA2 为某岗位给出外部渠道的人才搜索关键词、城市、排除词，或问去哪里找人。\nA3 从某候选人的简历提取技能、经历、学历等信息到档案。\nA4 请 AI 起草回复某候选人消息的话术（HR 没有给出具体内容）。\nA5 评估某候选人是否符合岗位要求、匹配度、能否通过初筛。\nA7 岗位数据洞察：问为什么招得慢、瓶颈在哪、怎么改进（需要 AI 分析和建议）。\npositions 岗位招聘进度、还差几人、招满没有、有哪些在招岗位（只问数字和现状）。\ncandidate 某位候选人的进展、到哪一步、基本情况、经历时间线。\n一句话里有两件或三件事时（如“客服专员还差几人，再看看张三到哪一步了”），intent 填第一件，then 按顺序填其余的（每项含 intent 和它需要的 position/candidate/keyword/content），最多两项；只有一件事时 then 为空列表。\nposition：逐字复制 text 中出现的岗位名称片段（如“白班客服”）；candidate：逐字复制 text 中出现的候选人姓名；keyword：按工具说明逐字复制技能词、标签文字、阶段名、时间词或需求名称。没有就留空字符串，不得猜测、补全或改写；代词（他、她、这个人、这个岗位）不要填进 candidate 或 position。\ncontent：message 时逐字复制要发送的消息正文（通常在冒号之后）；A6 时逐字复制面试记录原文；其他情况留空。\n区分：问数字、名单、图表用查询工具（positions/stats/pipeline），问为什么、怎么改进用 A7；HR 给出了消息原文用 message，让 AI 起草用 A4；发 offer、定薪资、做录用决定、审批、删除数据一律 none，即使同一句里还有别的请求。\nreason：一句话说明判断依据。\n示例：“你能做什么” → help；“整理张三的面试记录：沟通清晰，有两年电商客服经验” → A6；“把张三设为重点候选人” → key；“给张三打个标签：沟通好” → tag；“把张三的会话交还给 AI” → hand_back；“接管张三的会话” → take_over；“给张三发消息：明天上午 10 点电话沟通” → message；“撤销张三的淘汰” → restore；“淘汰张三” → reject；“把李四加到夜班客服” → attach；“推进张三” → advance；“暂停夜班客服的招聘” → pause；“恢复夜班客服的招聘” → resume；“张三最近说了什么” → conversation；“待我复核的 AI 结果” → reviews；“有哪些决策卡要处理” → cards；“本周的面试安排” → interviews；“录用待办” → hires；“招聘需求审批到哪了” → requisitions；“各部门编制还剩多少” → headcount；“客服的薪资带宽是多少” → salary；“现在的自动化设置是什么” → automation；“有哪些部门” → org；“看看客服专员的招聘漏斗” → stats；“今天有什么要处理” → overview；“客服专员面试阶段有哪些人” → pipeline；“找会 Excel 的候选人” → candidates；“帮客服专员写一版 JD” → A1；“给客服专员出一份人才搜索关键词” → A2；“提取张三的简历信息” → A3；“帮我回复张三的消息” → A4；“评估一下张三是否符合要求” → A5；“为什么夜班客服招得慢” → A7；“白班客服还差几个人” → positions；“张三到哪一步了” → candidate；“帮我给张三发offer” → none；“推进一下他” → advance；“客服专员还差几人，再看看张三到哪一步了” → positions, position=客服专员, then=[candidate, candidate=张三]。\nSchema:\n{\"$defs\": {\"AgentStep\": {\"additionalProperties\": false, \"description\": \"One tool call: the tool plus the mentions it needs, copied verbatim from the sentence.\", \"properties\": {\"intent\": {\"enum\": [\"A1\", \"A2\", \"A3\", \"A4\", \"A5\", \"A6\", \"A7\", \"overview\", \"positions\", \"pipeline\", \"stats\", \"candidates\", \"candidate\", \"conversation\", \"interviews\", \"hires\", \"reviews\", \"cards\", \"requisitions\", \"headcount\", \"salary\", \"automation\", \"org\", \"key\", \"tag\", \"take_over\", \"hand_back\", \"attach\", \"advance\", \"reject\", \"restore\", \"message\", \"pause\", \"resume\", \"help\", \"none\"], \"title\": \"Intent\", \"type\": \"string\"}, \"position\": {\"default\": \"\", \"maxLength\": 200, \"title\": \"Position\", \"type\": \"string\"}, \"candidate\": {\"default\": \"\", \"maxLength\": 200, \"title\": \"Candidate\", \"type\": \"string\"}, \"keyword\": {\"default\": \"\", \"maxLength\": 100, \"title\": \"Keyword\", \"type\": \"string\"}, \"content\": {\"default\": \"\", \"maxLength\": 8000, \"title\": \"Content\", \"type\": \"string\"}}, \"required\": [\"intent\"], \"title\": \"AgentStep\", \"type\": \"object\"}}, \"additionalProperties\": false, \"description\": \"Router (A0) output for the HR assistant: the first tool call plus up to two more.\\n\\nA0 only sees the sanitized sentence. Every mention must be copied from it, so the\\nbackend can verify it and never select a record from a guessed name.\", \"properties\": {\"intent\": {\"enum\": [\"A1\", \"A2\", \"A3\", \"A4\", \"A5\", \"A6\", \"A7\", \"overview\", \"positions\", \"pipeline\", \"stats\", \"candidates\", \"candidate\", \"conversation\", \"interviews\", \"hires\", \"reviews\", \"cards\", \"requisitions\", \"headcount\", \"salary\", \"automation\", \"org\", \"key\", \"tag\", \"take_over\", \"hand_back\", \"attach\", \"advance\", \"reject\", \"restore\", \"message\", \"pause\", \"resume\", \"help\", \"none\"], \"title\": \"Intent\", \"type\": \"string\"}, \"position\": {\"default\": \"\", \"maxLength\": 200, \"title\": \"Position\", \"type\": \"string\"}, \"candidate\": {\"default\": \"\", \"maxLength\": 200, \"title\": \"Candidate\", \"type\": \"string\"}, \"keyword\": {\"default\": \"\", \"maxLength\": 100, \"title\": \"Keyword\", \"type\": \"string\"}, \"content\": {\"default\": \"\", \"maxLength\": 8000, \"title\": \"Content\", \"type\": \"string\"}, \"reason\": {\"default\": \"\", \"maxLength\": 500, \"title\": \"Reason\", \"type\": \"string\"}, \"then\": {\"items\": {\"$ref\": \"#/$defs/AgentStep\"}, \"maxItems\": 2, \"title\": \"Then\", \"type\": \"array\"}}, \"required\": [\"intent\"], \"title\": \"AgentRoute\", \"type\": \"object\"}"
              },
              {
                "role": "user",
                "text": "资料：{{#start.context#}}\n独立评估序号：{{#start.sample#}}\n上次校验结果：{{#start.retry_reason#}}"
              }
            ],
            "context": {
              "enabled": false,
              "variable_selector": []
            },
            "vision": {
              "enabled": false
            },
            "retry_config": {
              "retry_enabled": false,
              "max_retries": 0,
              "retry_interval": 1000
            }
          },
          "position": {
            "x": 340,
            "y": 200
          },
          "sourcePosition": "right",
          "targetPosition": "left",
          "width": 244,
          "height": 100
        },
        {
          "id": "end",
