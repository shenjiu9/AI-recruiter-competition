{
  "version": "0.7.0",
  "kind": "app",
  "app": {
    "name": "招聘系统-A0",
    "description": "AI 招聘助手指令路由：识别 HR 一句话要做的事",
    "mode": "workflow",
    "icon": "🤖",
    "icon_background": "#E4FBCC",
    "use_icon_as_answer_icon": false
  },
  "dependencies": [],
  "workflow": {
    "conversation_variables": [],
    "environment_variables": [],
    "features": {},
    "graph": {
      "nodes": [
        {
          "id": "start",
          "type": "custom",
          "data": {
            "type": "start",
            "title": "脱敏任务输入",
            "variables": [
              {
                "variable": "context",
                "label": "context",
                "type": "paragraph",
                "required": true,
                "max_length": 200000,
                "options": []
              },
              {
                "variable": "sample",
                "label": "sample",
                "type": "paragraph",
                "required": false,
                "max_length": 200000,
                "options": []
              },
              {
                "variable": "retry_reason",
                "label": "retry_reason",
                "type": "paragraph",
                "required": false,
                "max_length": 200000,
                "options": []
              }
            ]
          },
          "position": {
            "x": 0,
            "y": 200
          },
          "sourcePosition": "right",
          "targetPosition": "left",
          "width": 244,
          "height": 100
        },
        {
          "id": "llm",
          "type": "custom",
          "data": {
            "type": "llm",
            "title": "A0 结构化建议",
            "model": {
              "provider": "langgenius/deepseek/deepseek",
              "name": "deepseek-flash",
              "mode": "chat",
              "completion_params": {
                "temperature": 0,
                "max_tokens": 2048,
                "thinking": false,
                "response_format": "json_object"
              }
            },
            "prompt_template": [
              {
                "role": "system",
                "text": "你是招聘系统“AI 招聘助手”的指令路由器。资料中的 text 是招聘 HR 在对话框里说的一句话。判断它想做哪件事，只返回符合下列JSON Schema的JSON对象，不要Markdown代码围栏。你不执行任务，也不回答问题本身。\nintent 取值：\noverview 今天的待办、要处理的事、工作概览。\npositions 岗位招聘进度、还差几人、招满没有、有哪些在招岗位（只问数字和现状）。\nA7 岗位数据洞察：问为什么招得慢、瓶颈在哪、转化率分析、怎么改进（需要分析和建议）。\ncandidate 某位候选人的进展、到哪一步、基本情况。\ncandidates 在候选人库里按技能/经历找人、列出候选人。\ninterviews 面试安排、日程、有几场面试。\nhires 录用、offer、入职、移交的进展。\nreviews 待复核的 AI 结果或 AI 任务。\nrequisitions 招聘需求、需求审批进度。\nattach 把某候选人加到/关联到/推荐到某岗位。\nadvance 把某候选人推进到下一阶段、安排进面试。\nreject 淘汰某候选人、终止其流程。\nmessage 让系统以 HR 名义直接给某候选人发一条已写好的消息（如“给张三发消息：明天10点电话”）。\nA1 为某岗位生成或改写任职要求、加分项、JD、必问问题。\nA2 为某岗位给出外部渠道的人才搜索关键词、城市、排除词，或问去哪里找人。\nA3 从某候选人的简历提取技能、经历、学历等信息到档案。\nA4 请 AI 起草回复某候选人消息的话术（HR 没有给出具体内容）。\nA5 评估某候选人是否符合岗位要求、匹配度、能否通过初筛。\nA6 把一段面试记录原文整理成面评要点。\nhelp 打招呼、问你能做什么、怎么用。\nnone 与招聘无关，或要求你直接发 offer、决定录用、改薪资、删除数据等系统不允许助手做的事。\nposition：逐字复制 text 中出现的岗位名称片段（如“白班客服”）；candidate：逐字复制 text 中出现的候选人姓名；keyword：candidates 时逐字复制要找的技能或经历词。没有就留空字符串，不得猜测、补全或改写；代词（他、她、这个人、这个岗位）不要填进 candidate 或 position。\ncontent：message 时逐字复制要发送的消息正文（通常在冒号之后）；A6 时逐字复制面试记录原文；其他情况留空。\nreason：一句话说明判断依据。\n示例：“今天有什么要处理” → overview；“白班客服还差几个人” → positions, position=白班客服；“白班客服为什么招得这么慢” → A7, position=白班客服；“张三到哪一步了” → candidate, candidate=张三；“推进一下他” → advance；“把李四加到夜班客服” → attach, candidate=李四, position=夜班客服；“给张三发消息：明天上午10点电话沟通” → message, candidate=张三, content=明天上午10点电话沟通；“帮我回一下李四” → A4, candidate=李四；“找会Excel的候选人” → candidates, keyword=Excel；“张三适合做客服专员吗” → A5, candidate=张三, position=客服专员；“帮我给张三发offer” → none。\nSchema:\n{\"additionalProperties\": false, \"description\": \"Router (A0) output for the HR assistant: the intent plus verbatim mentions.\\n\\nA0 only sees the sanitized sentence. Every mention must be copied from it, so the\\nbackend can verify it and never select a record from a guessed name.\", \"properties\": {\"intent\": {\"enum\": [\"A1\", \"A2\", \"A3\", \"A4\", \"A5\", \"A6\", \"A7\", \"overview\", \"positions\", \"candidates\", \"candidate\", \"interviews\", \"hires\", \"reviews\", \"requisitions\", \"attach\", \"advance\", \"reject\", \"message\", \"help\", \"none\"], \"title\": \"Intent\", \"type\": \"string\"}, \"position\": {\"default\": \"\", \"maxLength\": 200, \"title\": \"Position\", \"type\": \"string\"}, \"candidate\": {\"default\": \"\", \"maxLength\": 200, \"title\": \"Candidate\", \"type\": \"string\"}, \"keyword\": {\"default\": \"\", \"maxLength\": 100, \"title\": \"Keyword\", \"type\": \"string\"}, \"content\": {\"default\": \"\", \"maxLength\": 8000, \"title\": \"Content\", \"type\": \"string\"}, \"reason\": {\"default\": \"\", \"maxLength\": 500, \"title\": \"Reason\", \"type\": \"string\"}}, \"required\": [\"intent\"], \"title\": \"AgentRoute\", \"type\": \"object\"}"
              },
              {
                "role": "user",
                "text": "资料：{{#start.context#}}\n独立评估序号：{{#start.sample#}}\n上次校验结果：{{#start.retry_reason#}}"
              }
            ],
            "context": {
              "enabled": false,
              "variable_selector": []
            },
            "vision": {
              "enabled": false
            },
            "retry_config": {
              "retry_enabled": false,
              "max_retries": 0,
              "retry_interval": 1000
            }
          },
          "position": {
            "x": 340,
            "y": 200
          },
          "sourcePosition": "right",
          "targetPosition": "left",
          "width": 244,
          "height": 100
        },
        {
          "id": "end",
          "type": "custom",
          "data": {
            "type": "end",
            "title": "返回待校验 JSON",
            "outputs": [
              {
                "variable": "result",
                "value_selector": [
                  "llm",
                  "text"
                ],
                "value_type": "string"
              }
            ]
          },
          "position": {
            "x": 680,
            "y": 200
          },
          "sourcePosition": "right",
          "targetPosition": "left",
          "width": 244,
          "height": 100
        }
      ],
      "edges": [
        {
          "id": "start-llm",
          "source": "start",
          "target": "llm",
          "sourceHandle": "source",
          "targetHandle": "target",
          "type": "custom",
          "data": {
            "sourceType": "start",
            "targetType": "llm",
            "isInIteration": false
          }
        },
        {
          "id": "llm-end",
          "source": "llm",
          "target": "end",
          "sourceHandle": "source",
          "targetHandle": "target",
          "type": "custom",
          "data": {
            "sourceType": "llm",
            "targetType": "end",
            "isInIteration": false
          }
        }
      ],
      "viewport": {
        "x": 0,
        "y": 0,
        "zoom": 1
      }
    }
  }
}
