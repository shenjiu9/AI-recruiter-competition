name: backend
on:
  push:
    branches: [main, 'feat/backend-*']
    paths: ['backend/**', 'deploy/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', 'deploy/**', '.github/workflows/backend.yml']

jobs:
  postgres-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: recruiter
          POSTGRES_PASSWORD: recruiter
          POSTGRES_DB: recruiter_test
        ports: ['5432:5432']
        options: --health-cmd 'pg_isready -U recruiter -d recruiter_test' --health-interval 5s --health-timeout 5s --health-retries 15
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://recruiter:recruiter@localhost:5432/recruiter_test
      TEST_DATABASE_URL: postgresql+psycopg://recruiter:recruiter@localhost:5432/recruiter_test
      SIGNING_KEY: ci-only-signing-key-not-for-production-000000000000
      ENCRYPTION_KEY: ZWVlZWVlZWVlZWVlZWVlZWVlZWVlZWVlZWVlZWVlZWU=
      DEV_AUTH_ENABLED: 'true'
      DEV_LOGIN_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements-dev.lock -e .
      - run: ruff check app tests migrations scripts
      - run: ruff format --check app tests migrations scripts
      - run: lint-imports
      - run: alembic upgrade head
      - run: pytest -q
      - run: alembic downgrade base && alembic upgrade head && alembic check
      - run: docker build -t recruiter-api-ci .
