name: frontend

on:
  push:
    branches: [main]
    paths: ['frontend/**', 'package.json', 'pnpm-workspace.yaml', 'turbo.json', 'tsconfig.base.json', 'eslint.config.js']
  pull_request:
    paths: ['frontend/**', 'package.json', 'pnpm-workspace.yaml', 'turbo.json', 'tsconfig.base.json', 'eslint.config.js']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
