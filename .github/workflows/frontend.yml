name: frontend

on:
  push:
    branches: [main, 'feat/backend-*']
    paths: ['frontend/**', 'backend/**', 'package.json', 'pnpm-lock.yaml', 'playwright.config.ts', 'pnpm-workspace.yaml', 'turbo.json', 'tsconfig.base.json', 'eslint.config.js', '.github/workflows/frontend.yml']
  pull_request:
    paths: ['frontend/**', 'backend/**', 'package.json', 'pnpm-lock.yaml', 'playwright.config.ts', 'pnpm-workspace.yaml', 'turbo.json', 'tsconfig.base.json', 'eslint.config.js', '.github/workflows/frontend.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm build
        name: Build real API mode
        env:
          VITE_USE_MOCK: 'false'
  browser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: pnpm}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements-dev.lock -e .
        working-directory: backend
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: test-results/
